name: CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:

jobs:
  shellcheck-and-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Shellcheck
        run: bash .env-core/shellcheck.sh

      - name: Unit tests
        run: bash .env-core/tests/unit/run.sh

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .env-core/webui
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same major as ARG NODE_IMAGE in .env-core/webui/Dockerfile.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .env-core/webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
