services:
  {DOMAIN_NAME}-nodejs_api:
    container_name: {DOMAIN_NAME}-nodejs_api
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
    env_file: .env
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 3000
    volumes:
      - ../:/app
      - /app/node_modules
    ports:
      - "${PORT}:3000"
    restart: always

networks:
  default:
    name: dockerwp
    external: true
